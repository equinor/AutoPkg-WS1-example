Identifier: local.ws1.PaloAltoNetworksGlobalProtect
Input:
  DISPLAY_NAME: Palo Alto Networks GlobalProtect
  DOWNLOAD_URL: https://%HOSTNAME%/global-protect/getmsi.esp?platform=%PLATFORM%
  HOSTNAME: <REDACTED>
  MUNKI_CATEGORY: IT
  MUNKI_REPO_SUBDIR: apps/Palo Alto Networks
  NAME: Palo Alto Networks GlobalProtect
  PLATFORM: mac
  WS1_API_PASSWORD: none
  WS1_API_TOKEN: none
  WS1_API_URL: none
  WS1_API_USERNAME: none
  WS1_B64ENCODED_API_CREDENTIALS: none
  WS1_CONSOLE_URL: none
  WS1_GROUPID: none
  WS1_OAUTH_CLIENT_ID: none
  WS1_OAUTH_CLIENT_SECRET: none
  WS1_OAUTH_TOKEN_URL: none
  WS1_PUSH_MODE: none
  WS1_SMART_GROUP_NAME: none
  pkginfo:
    catalogs:
    - testing
    category: IT
    description: GlobalProtect delivers the protection of next-generation security
      platform to the mobile workforce in order to stop targeted cyberattacks, evasive
      application traffic, phishing, malicious websites, command-and-control traffic,
      and known and unknown threats.
    developer: Palo Alto Networks
    display_name: '%DISPLAY_NAME%'
    name: '%NAME%'
    notes: |
      2024-03-05 Intended to process the software package from YOUR company firewall - you need to specify your
      portal hostname in the recipe override
    postinstall_script: |
      #!/usr/bin/env zsh

      # This script applies a tweak to put the menubar icon for GlobalProtect next
      # to Wi-Fi icon to avoid camera notch on some MacBook models


      # Get this scripts starting folder
      this_script="${0:a}"
      # script_path="${this_script:h}"
      this_script_name="${this_script:t}"


      logfile="/tmp/${this_script_name}.log"


      # write timestamp + message to logfile + stdout
      function log() {
          timestamp=$(date +%Y-%m-%d\ %H:%M:%S%z)
          message="$timestamp [$this_script_name] $1"
          echo "$message"
          echo "$message" >> "${logfile}"
      }


      # get the currently logged in user
      currentUser=$( echo "show State:/Users/ConsoleUser" | scutil | awk '/Name :/ { print $3 }' )


      # global check if there is a user logged in
      if [ -z "$currentUser" -o "$currentUser" = "loginwindow" ]; then
          log "no user logged in, cannot proceed"
          exit 1
      fi
      # now we know a user is logged in


      # get the current user's UID
      uid=$(id -u "$currentUser")

      # convenience function to run a command as the current user
      # usage:
      #   runAsUser command arguments...
      function runAsUser() {
          if [ "$currentUser" != "loginwindow" ]; then
              launchctl asuser "$uid" sudo -u "$currentUser" "$@"
          else
              log "no user logged in"
              # uncomment the exit command
              # to make the function exit with an error when no user is logged in
              # exit 1
          fi
      }


      # Tweak to get the GlobalProtect icon to show next to the Wi-Fi icon in the menu bar
      log "applying tweak to put menubar icon for GlobalProtect next to Wi-Fi icon to avoid camera notch on some MacBook models"
      runAsUser defaults write com.paloaltonetworks.GlobalProtect.client "NSStatusItem Preferred Position Item-0" -int 350

      log "restarting the GlobalProtect app"
      # Kill the GlobalProtect app to apply the tweak, will be restarted automatically right away by LaunchDaemon
      runAsUser pkill GlobalProtect
    preinstall_script: |
      #!/bin/bash
      ## Description: Checks for global preferences file and populates
      ## it with the default portal if needed.
      ## Body ###########################################################
      ## Declare Variables ##############################################

      # Get current Console user
      active_user=$( stat -f "%Su" /dev/console )

      # Global Prefs File
      gPrefs=/Library/Preferences/com.paloaltonetworks.GlobalProtect.settings.plist

      ## Logic ##########################################################

      # Check to see if the global preference file already exists...
      if [[ -e $gPrefs ]]; then
          echo "Default global portal already exists. Skipping."
      else
          echo "Setting default global portal to: <REDACTED>"
          # If it does not already exist, create it and populate the default portal using the echo command
          echo '<?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>Palo Alto Networks</key>
          <dict>
              <key>GlobalProtect</key>
              <dict>
                  <key>PanSetup</key>
                  <dict>
                      <key>Portal</key>
                      <string><REDACTED></string>
                      <key>Prelogon</key>
                      <string>0</string>
                  </dict>
                  <key>Settings</key>
                  <dict>
                      <key>connect-method</key>
                      <string>on-demand</string>
                      <key>default-browser</key>
                      <string>yes</string>
                  </dict>
              </dict>
          </dict>
      </dict>
      </plist>
      ' > $gPrefs

          echo $?
          # Kill the Preference caching daemon to prevent it from overwriting any changes
          killall cfprefsd
          echo $?
      fi
      # Check exit code.
      exit $?
    unattended_install: false
    unattended_uninstall: true
    uninstall_method: uninstall_script
    uninstall_script: |
      #!/bin/zsh

      ## call uninstall script inside installed app bundle
      /Applications/GlobalProtect.app/Contents/Resources/uninstall_gp.sh
      exit $?
